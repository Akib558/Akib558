name: Update WakaTime

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update weekly coding activity
        uses: athul/waka-readme@370590ad8da8f54282ed92aa42b7c25ecbd5a9a6 # master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          TARGET_BRANCH: main
          TIME_RANGE: last_7_days
          LANG_COUNT: "5"
          SHOW_TIME: "true"
          SHOW_TOTAL: "true"
          COMMIT_MESSAGE: "chore: update WakaTime stats"
