<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Akib.</title>
  <desc id="desc">Full-stack developer in Dhaka building web products, mobile apps, and open-source tools.</desc>

  <style>
    :root {
      --canvas: #fbfaf7;
      --surface: #ffffff;
      --ink: #171717;
      --muted: #626262;
      --line: #dedbd4;
      --accent: #a84e28;
      --accent-soft: #f3e5dc;
    }

    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .cursor { animation: blink 1.4s steps(1, end) infinite; }

    @keyframes blink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #0d1117;
        --surface: #161b22;
        --ink: #f0f3f6;
        --muted: #9198a1;
        --line: #30363d;
        --accent: #d08a64;
        --accent-soft: #2b211d;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; }
    }
  </style>

  <rect x="1" y="1" width="898" height="278" rx="24" fill="var(--canvas)" stroke="var(--line)" />

  <g class="sans">
    <text x="52" y="62" fill="var(--accent)" font-size="12" font-weight="700" letter-spacing="2.4">WEB &#183; MOBILE &#183; TERMINAL</text>
    <text x="50" y="126" fill="var(--ink)" font-size="56" font-weight="700" letter-spacing="-2.1">Hi, I'm Akib.</text>
    <rect x="52" y="145" width="52" height="3" rx="1.5" fill="var(--accent)" />
    <text x="52" y="184" fill="var(--ink)" font-size="18" font-weight="600">Full-stack developer &#183; apps, products, tools</text>
    <text x="52" y="214" fill="var(--muted)" font-size="15">Dhaka, Bangladesh &#183; GMT+6</text>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M574 222H842" stroke="var(--line)" stroke-width="2" />

    <rect x="650" y="52" width="188" height="140" rx="12" fill="var(--surface)" stroke="var(--line)" stroke-width="2" />
    <path d="M650 80H838" stroke="var(--line)" stroke-width="2" />
    <circle cx="670" cy="66" r="3.5" fill="var(--accent)" />
    <circle cx="682" cy="66" r="3.5" fill="var(--line)" />
    <circle cx="694" cy="66" r="3.5" fill="var(--line)" />

    <path d="M678 113H716M730 113H808" stroke="var(--line)" stroke-width="2" />
    <path d="M678 143H735M749 143H808" stroke="var(--line)" stroke-width="2" />
    <circle cx="678" cy="113" r="5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2" />
    <circle cx="730" cy="113" r="5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2" />
    <circle cx="808" cy="113" r="5" fill="var(--accent)" stroke="var(--accent)" stroke-width="2" />
    <circle cx="678" cy="143" r="5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2" />
    <circle cx="749" cy="143" r="5" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2" />
    <rect class="cursor" x="786" y="163" width="18" height="3" rx="1.5" fill="var(--accent)" stroke="none" />

    <circle cx="590" cy="110" r="21" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2" />
    <path d="M571 105C577 97 584 93 594 93C603 93 610 97 615 104" stroke="var(--accent)" stroke-width="2" />
    <path d="M570 138C552 151 548 178 554 211" stroke="var(--ink)" stroke-width="3" />
    <path d="M570 138C585 132 604 135 614 148L631 171" stroke="var(--ink)" stroke-width="3" />
    <path d="M588 153L616 180H656" stroke="var(--ink)" stroke-width="3" />
    <path d="M554 211H612M578 211L594 239M554 211L542 239" stroke="var(--ink)" stroke-width="3" />
    <path d="M611 185V222M600 222H622" stroke="var(--line)" stroke-width="2" />
  </g>

  <g class="mono" fill="var(--muted)" font-size="9" font-weight="600">
    <text x="670" y="101">WEB</text>
    <text x="722" y="101">APP</text>
    <text x="793" y="101">CLI</text>
  </g>
</svg>
