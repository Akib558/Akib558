<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" fill="none" role="img" aria-label="akib — backend engineer terminal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1218"/>
      <stop offset="0.55" stop-color="#0b0e13"/>
      <stop offset="1" stop-color="#120d0b"/>
    </linearGradient>
    <linearGradient id="barg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2028"/>
      <stop offset="1" stop-color="#141922"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3038"/>
      <stop offset="1" stop-color="#3a2418"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .mono   { font-family: 'JetBrains Mono','SFMono-Regular',ui-monospace,Consolas,monospace; }
    .prompt { fill: #e0662f; font-weight: 700; }
    .cmd    { fill: #eef2f7; }
    .flag   { fill: #e0b155; }        /* amber */
    .svc    { fill: #79a6f6; }        /* soft blue */
    .tech   { fill: #4ec9b0; }        /* teal */
    .str    { fill: #c9d4e3; }
    .dim    { fill: #5f6b7a; }
    .arrow  { fill: #e0662f; }
    .ok     { fill: #4ac26b; }        /* green */

    .line { opacity: 0; transform: translateX(8px); animation: in .45s ease forwards; }
    @keyframes in { to { opacity: 1; transform: translateX(0); } }
    .l1{animation-delay:.3s}.l2{animation-delay:.9s}.l3{animation-delay:1.5s}
    .l4{animation-delay:2.1s}.l5{animation-delay:2.7s}.l6{animation-delay:3.3s}
    .l7{animation-delay:3.9s}.l8{animation-delay:4.6s}.l9{animation-delay:5.2s}

    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .caret { animation: blink 1.05s steps(1) infinite; animation-delay: 5.6s; opacity: 0; }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
  </style>

  <!-- window -->
  <rect x="1.5" y="1.5" width="897" height="357" rx="14" fill="url(#bg)" stroke="url(#edge)" stroke-width="1.5"/>
  <rect x="2" y="2" width="896" height="40" rx="13" fill="url(#barg)"/>
  <rect x="2" y="28" width="896" height="14" fill="#141922"/>
  <line x1="2" y1="42" x2="898" y2="42" stroke="#252b34" stroke-width="1"/>
  <circle cx="26" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="21" r="6" fill="#27c93f"/>
  <text class="mono dim" x="450" y="26" font-size="13" text-anchor="middle">akib@netpower — zsh</text>

  <!-- body -->
  <g class="mono" font-size="16">
    <text class="line l1" x="28" y="82"><tspan class="prompt">$</tspan> <tspan class="cmd">akib</tspan> <tspan class="flag">--whoami</tspan></text>
    <text class="line l2" x="28" y="108"><tspan class="arrow">→</tspan> <tspan class="str">Software Engineer</tspan> <tspan class="dim">· backend, identity &amp; data systems · Dhaka</tspan></text>

    <text class="line l3" x="28" y="150"><tspan class="prompt">$</tspan> <tspan class="cmd">systemctl</tspan> <tspan class="cmd">status</tspan> <tspan class="flag">--user</tspan></text>
    <g class="line l4"><circle class="pulse ok" cx="34" cy="171" r="5"/><text x="50" y="176"><tspan class="svc">identity.service</tspan> <tspan class="ok">active (running)</tspan> <tspan class="dim">· SCIM · OAuth 2.0 · Entra ID</tspan></text></g>
    <g class="line l5"><circle class="pulse ok" cx="34" cy="197" r="5"/><text x="50" y="202"><tspan class="svc">data-migration.service</tspan> <tspan class="ok">active (running)</tspan> <tspan class="dim">· idempotent · deterministic</tspan></text></g>
    <g class="line l6"><circle class="pulse ok" cx="34" cy="223" r="5"/><text x="50" y="228"><tspan class="svc">netpower.platform</tspan> <tspan class="ok">active (running)</tspan> <tspan class="dim">· .NET 8 · production</tspan></text></g>

    <text class="line l7" x="28" y="270"><tspan class="prompt">$</tspan> <tspan class="cmd">echo</tspan> <tspan class="flag">$STACK</tspan></text>
    <text class="line l8" x="28" y="296"><tspan class="arrow">→</tspan> <tspan class="tech">C#</tspan><tspan class="dim"> · </tspan><tspan class="tech">.NET</tspan><tspan class="dim"> · </tspan><tspan class="tech">Angular</tspan><tspan class="dim"> · </tspan><tspan class="tech">Go</tspan><tspan class="dim"> · </tspan><tspan class="tech">SQL Server</tspan><tspan class="dim"> · </tspan><tspan class="tech">Postgres</tspan><tspan class="dim"> · </tspan><tspan class="tech">Docker</tspan></text>

    <text class="line l9" x="28" y="330"><tspan class="prompt">$</tspan> <tspan class="caret arrow" filter="url(#glow)">█</tspan></text>
  </g>
</svg>
